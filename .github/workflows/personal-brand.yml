name: Publish personal brand page
on:
  push:
    paths:
      - 'personal-brand/**'
      - '.github/workflows/personal-brand.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: personal-brand-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: personal-brand
      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@v4